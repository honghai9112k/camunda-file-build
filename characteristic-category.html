<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Lowcoder Tree Table Expand</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.10/antd.min.css"
    />
    <style>
      body {
        padding: 16px;
        font-family: Arial, sans-serif;
      }
      .table-container {
        background: #fff;
        padding: 16px;
        border-radius: 8px;
      }
      .ant-table-pagination.ant-pagination {
        margin: 24px 0;
      }
      .ant-table-tbody > tr:hover > td {
        background-color: #fafafa;
      }
      .ant-btn-icon-only {
        padding: 4px;
      }
      .ant-table-cell {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ant-table,
      .ant-table-cell,
      .ant-table-thead > tr > th,
      .ant-table-tbody > tr > td,
      .anticon {
        color: #334155 !important;
        font-size: 14px !important;
      }
      .ant-table-thead > tr > th {
        background: #fff !important;
        font-weight: bold !important;
        color: #334155 !important;
      }
      .custom-expand-icon {
        margin-right: 8px;
        cursor: pointer;
      }

      /* Search Component Styles */
      .filter-icon {
        cursor: pointer;
      }

      .filter-container {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .filter-input {
        flex: 1;
        max-width: 300px;
      }

      .icon-btn {
        border: none;
        background: none;
        cursor: pointer;
      }

      .action-row {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 20px;
      }

      .action-buttons {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .select-group {
        display: flex;
        gap: 16px;
      }

      .select-item {
        display: flex;
        flex-direction: column;
      }

      .select-item label {
        font-size: 12px;
        margin-bottom: 4px;
        color: #555;
      }

      .order-select {
        width: 120px;
      }

      .sort-select {
        width: 120px;
      }

      .nodes-row {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 8px;
      }

      .node {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 432px;
        border: 1px solid #d9d9d9;
        padding: 6px;
        border-radius: 6px;
        background: #fafafa;
        flex-shrink: 0;
      }

      .node-delete {
        border: none !important;
        background: transparent !important;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: #999;
        font-size: 16px;
      }

      .node-delete:hover {
        color: #ff4d4f;
      }

      .node-select {
        width: 124px;
      }

      .node-operator {
        width: 63px;
      }

      .node-value {
        flex: 1;
        min-width: 80px;
      }

      .search-card {
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.4/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.10/antd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ant-design-icons/5.6.1/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>

    <script type="text/babel">
      const { useState, useEffect, useCallback } = React;
      const {
        Table,
        Button,
        Space,
        Input,
        Select,
        Card,
        Switch,
        message,
        Modal,
      } = antd;
      const {
        FormOutlined,
        PlusCircleOutlined,
        DownOutlined,
        RightOutlined,
        FilterOutlined,
        PlusOutlined,
        DeleteOutlined,
        ReloadOutlined,
        SearchOutlined,
        ExclamationCircleOutlined,
      } = icons;
      const scroll = { x: 1000 };

      const valueTypes = {
        TEXT: "TEXT",
        PICK_LIST: "PICK_LIST",
        BOOLEAN: "BOOLEAN",
      };

      const orderOptions = [
        { label: "Create Date", value: "id" },
        { label: "Name", value: "name" },
        { label: "Code", value: "code" },
      ];
      const sortOptions = ["Ascending", "Descending"];

      const SearchComponent = ({
        runQuery,
        model,
        updateModel,
        onReload,
        onDeleteSelected,
        selectedCount,
        onSearch,
      }) => {
        const [showFilter, setShowFilter] = useState(false);
        const [nodes, setNodes] = useState([]);
        const [order, setOrder] = useState(orderOptions[0].value);
        const [sort, setSort] = useState(sortOptions[0]);
        const [searchText, setSearchText] = useState("");
        const [isComposing, setIsComposing] = useState(false);

        const allOptions = model?.allOptions || [];

        const handleAddNode = () => {
          if (nodes.length >= allOptions.length) return;
          setNodes([...nodes, { field: null, operator: "=", value: "" }]);
        };

        const handleDeleteNode = (index) => {
          const newNodes = nodes.filter((_, i) => i !== index);
          setNodes(newNodes);
        };

        const handleUpdateNode = (index, key, val) => {
          const newNodes = [...nodes];
          newNodes[index][key] = val;
          setNodes(newNodes);
        };

        const getParam = (nodesSreach, orderSearch, sortSearch) => {
          const paramSort = sortSearch === "Ascending" ? `sort=${orderSearch}` : `sort=-${orderSearch}`;
          const res = nodesSreach
            .filter((f) => f.field)
            .map((f) => {
              const value = encodeURIComponent(f.value);
              return f.operator === "=" ? `${f.field}=${value}` : `${f.field}.${f.operator}=${value}`;
            });
          
          const resString = res.length > 0 ? `&&${res.join("&")}&${paramSort}` : `&&${paramSort}`;
          onSearch && onSearch(resString);
        };

        const availableOptions = (currentIndex) => {
          const selectedFields = nodes
            .map((n) => n.field)
            .filter((f) => f !== null && f !== undefined);

          return allOptions.filter(
            (opt) =>
              !selectedFields.includes(opt.value) ||
              nodes[currentIndex].field === opt.value
          );
        };

        const reloadSearch = () => {
          setNodes([]);
          setOrder(orderOptions[0].value);
          setSort(sortOptions[0]);
          setShowFilter(false);
          updateModel({ uriState: "" });
          setSearchText("");
          if (onReload) {
            onReload();
          }
        };

        const handleSearchChange = (e) => {
          const val = e?.target?.value ?? e;
          setSearchText(val);
          if (!val?.trim()) onReload?.();
        };

        useEffect(() => {
          if (isComposing || !searchText.trim()) return;
          
          const handler = setTimeout(() => {
            const searchString = `&name.like.or=${encodeURIComponent(searchText)}&code.like.or=${encodeURIComponent(searchText)}`;
            onSearch?.(searchString);
          }, 300);
          
          return () => clearTimeout(handler);
        }, [searchText, isComposing]);

        return (
          <Card className="search-card">
            <div className="filter-container">
              <Input
                className="filter-input"
                placeholder="Search name..."
                onChange={handleSearchChange}
                onCompositionStart={() => setIsComposing(true)}
                onCompositionEnd={() => setIsComposing(false)}
                addonAfter={
                  <FilterOutlined
                    className="filter-icon"
                    onClick={() => setShowFilter(!showFilter)}
                  />
                }
              />
              <Button
                className="icon-btn"
                icon={<PlusOutlined />}
                onClick={() => runQuery(model.showModelAddParent)}
              />
              <Button
                className="icon-btn"
                icon={<DeleteOutlined />}
                onClick={onDeleteSelected}
                disabled={selectedCount === 0}
                title={`Xóa ${selectedCount} mục đã chọn`}
              />
              <Button
                className="icon-btn"
                icon={<ReloadOutlined />}
                onClick={reloadSearch}
              />
            </div>

            {showFilter && (
              <div>
                <div className="action-row">
                  <div className="action-buttons">
                    <Button
                      type="dashed"
                      icon={<PlusOutlined />}
                      onClick={handleAddNode}
                    >
                      Add action
                    </Button>
                    {nodes.length > 0 && (
                      <Button
                        type="default"
                        icon={<SearchOutlined />}
                        onClick={() => getParam(nodes, order, sort)}
                      />
                    )}
                  </div>

                  <div className="select-group">
                    <div className="select-item">
                      <label>Order</label>
                      <Select
                        className="order-select"
                        value={order}
                        onChange={setOrder}
                        options={orderOptions}
                      />
                    </div>
                    <div className="select-item">
                      <label>Sort</label>
                      <Select
                        className="sort-select"
                        value={sort}
                        onChange={setSort}
                        options={sortOptions.map((o) => ({
                          value: o,
                          label: o,
                        }))}
                      />
                    </div>
                  </div>
                </div>

                <div className="nodes-row">
                  {nodes.map((node, index) => {
                    const optConfig = allOptions.find(
                      (o) => o.value === node.field
                    );

                    return (
                      <div key={index} className="node">
                        <Select
                          className="node-select"
                          placeholder="Chọn field"
                          value={node.field}
                          onChange={(val) =>
                            handleUpdateNode(index, "field", val)
                          }
                          options={availableOptions(index).map((o) => ({
                            value: o.value,
                            label: o.label,
                          }))}
                        />
                        <Select
                          className="node-operator"
                          value={node.operator}
                          onChange={(val) =>
                            handleUpdateNode(index, "operator", val)
                          }
                          options={
                            optConfig?.operators || [{ value: "=", label: "=" }]
                          }
                        />

                        {optConfig?.type === valueTypes.BOOLEAN ? (
                          <Switch
                            checked={node.value === true}
                            onChange={(val) =>
                              handleUpdateNode(index, "value", val)
                            }
                          />
                        ) : optConfig?.type === valueTypes.PICK_LIST ? (
                          <Select
                            className="node-value"
                            value={node.value}
                            onChange={(val) =>
                              handleUpdateNode(index, "value", val)
                            }
                            options={optConfig?.options || []}
                          />
                        ) : (
                          <Input
                            className="node-value"
                            value={node.value}
                            onChange={(e) =>
                              handleUpdateNode(index, "value", e.target.value)
                            }
                          />
                        )}
                        <Button
                          icon={<DeleteOutlined />}
                          onClick={() => handleDeleteNode(index)}
                          className="node-delete"
                        />
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </Card>
        );
      };

      const MyCustomComponent = ({ runQuery, model, updateModel }) => {
        const [dataTable, setDataTable] = React.useState([]);
        const [pagination, setPagination] = React.useState({
          current: 1,
          pageSize: 10,
          total: 0,
        });
        const [selectedRowKeys, setSelectedRowKeys] = React.useState([]);

        // Sử dụng ref để tránh tạo function mới
        const paginationRef = React.useRef(pagination);

        // Cập nhật ref khi pagination thay đổi
        React.useEffect(() => {
          paginationRef.current = pagination;
        }, [pagination]);

        // Hàm fetch data với offset và limit - đơn giản hóa dependencies
        const fetchRootNodes = React.useCallback(
          async (page = 1, pageSize = 10, searchString = "") => {
            if (!model.authorization) {
              return;
            }
            try {
              const offset = page - 1;
              const url = `http://10.165.68.7:30216/characteristicCategory?offset=${offset}&limit=${pageSize}&filter=%24%5B%3F(%40.isRoot%3D%3Dtrue)%5D${searchString}`;
              const response = await fetch(url, {
                headers: {
                  Authorization: `Bearer ${model.authorization}`,
                  "Content-Type": "application/json",
                },
              });
              if (!response.ok)
                throw new Error("API error: " + response.status);
              
              // Lấy total count từ header
              const totalCount = response.headers.get('X-Total-Count');
              const total = totalCount ? parseInt(totalCount, 10) : 0;
              console.log("Total count:", totalCount, response.headers);
              
              const data = await response.json();
              if (Array.isArray(data)) {
                const mapped = data.map((item, idx) => ({
                  key: item.id || idx,
                  ...item,
                  isParent: !item.isLeaf,
                  children: item.isLeaf === false ? [] : undefined,
                }));
                setDataTable(mapped);
                const newPagination = {
                  current: page,
                  pageSize: pageSize,
                  total: total,
                };
                setPagination(newPagination);
                paginationRef.current = newPagination;
              }
            } catch (err) {
              // bỏ qua lỗi
            }
          },
          [model.authorization]
        );

        // Hàm xử lý search với filter string - sử dụng ref để tránh dependency
        const handleSearch = React.useCallback(
          (searchString) => {
            fetchRootNodes(1, paginationRef.current.pageSize, searchString);
          },
          [fetchRootNodes]
        );

        // Lấy danh sách root node từ API khi component mount
        React.useEffect(() => {
          fetchRootNodes();
        }, [model.authorization]);

        // Theo dõi model.countLoad để reload lại table khi cần
        React.useEffect(() => {
          console.log("model.countLoad changed:", model.countLoad);

          if (model.countLoad > 0) {
            fetchRootNodes(pagination.current, pagination.pageSize);
          }
        }, [model.countLoad]);

        const [parentId, setParentId] = React.useState("");

        const columns = [
          {
            title: "Selected",
            dataIndex: "selected",
            key: "selected",
            width: 100,
            render: (val, record) => (
              <input
                type="checkbox"
                checked={selectedRowKeys.includes(record.id)}
                onChange={(e) => {
                  if (e.target.checked) {
                    setSelectedRowKeys([...selectedRowKeys, record.id]);
                  } else {
                    setSelectedRowKeys(
                      selectedRowKeys.filter((key) => key !== record.id)
                    );
                  }
                }}
              />
            ),
          },
          {
            title: "Name",
            dataIndex: "name",
            key: "name",
            width: 200,
            ellipsis: true,
          },
          { title: "Code", dataIndex: "code", key: "code", width: 150 },
          {
            title: "Domain",
            dataIndex: "domain",
            key: "domain",
            width: 150,
            render: (val) => (val ? val.toUpperCase() : ""),
          },
          {
            title: "Mô tả",
            dataIndex: "description",
            key: "description",
            width: 200,
            ellipsis: true,
          },
          {
            title: "Thao tác",
            key: "action",
            width: 116,
            align: "left",
            fixed: "right",
            render: (_, record) => (
              <Space size="small">
                {record.isParent && (
                  <Button
                    type="link"
                    icon={<PlusCircleOutlined />}
                    title="Thêm mới"
                    onClick={() => handleAdd(record)}
                  />
                )}
                <Button
                  type="link"
                  icon={<FormOutlined />}
                  title="Sửa"
                  onClick={() => handleEdit(record)}
                />
                <Button
                  type="link"
                  danger
                  icon={<icons.DeleteOutlined />}
                  title="Xóa"
                  onClick={() => handleDelete(record)}
                />
              </Space>
            ),
          },
        ];

        const handleAdd = (record) => {
          updateModel({ rowDataSelect: record });
          runQuery(model.showModelAddChild);
        };

        const handleDelete = async (record) => {
          if (!model.authorization) return message.error("Không có quyền truy cập");

          Modal.confirm({
            title: "Xác nhận xóa",
            icon: <ExclamationCircleOutlined />,
            content: `Bạn có chắc chắn muốn xóa "${record.name}"?`,
            okText: "Xóa",
            okType: "danger",
            cancelText: "Hủy",
            onOk: async () => {
              if (record?.id) {
                try {
                  const response = await fetch(`http://10.165.68.7:30216/characteristicCategory/${record.id}`, {
                    method: "DELETE",
                    headers: {
                      Authorization: `Bearer ${model.authorization}`,
                      "Content-Type": "application/json",
                    },
                  });
                  
                  if (response.ok) {
                    fetchRootNodes(pagination.current, pagination.pageSize);
                    message.success(`Đã xóa thành công "${record.name}"`);
                    console.log("Deleted record:", record.id);
                  } else {
                    message.error(`Xóa thất bại: ${response.status} - Không thể xóa bản ghi này.`);
                  }
                } catch (err) {
                  message.error("Có lỗi xảy ra khi xóa dữ liệu");
                  console.error("Delete error:", err);
                }
              }
            },
          });
        };

        const handleDeleteSelected = async () => {
          if (!model.authorization) return message.error("Không có quyền truy cập");
          if (selectedRowKeys.length === 0) return message.warning("Vui lòng chọn ít nhất một mục để xóa");

          Modal.confirm({
            title: "Xác nhận xóa hàng loạt",
            icon: <ExclamationCircleOutlined />,
            content: `Bạn có chắc chắn muốn xóa ${selectedRowKeys.length} mục đã chọn?`,
            okText: "Xóa tất cả",
            okType: "danger",
            cancelText: "Hủy",
            onOk: async () => {
              try {
                message.loading(`Đang xóa ${selectedRowKeys.length} mục...`, 0);

                const results = await Promise.allSettled(
                  selectedRowKeys.map((id) =>
                    fetch(`http://10.165.68.7:30216/characteristicCategory/${id}`, {
                      method: "DELETE",
                      headers: {
                        Authorization: `Bearer ${model.authorization}`,
                        "Content-Type": "application/json",
                      },
                    })
                  )
                );

                const successCount = results.filter((r) => r.status === "fulfilled" && r.value.ok).length;
                const failedCount = selectedRowKeys.length - successCount;

                message.destroy();
                
                if (failedCount === 0) {
                  message.success(`Đã xóa thành công ${successCount} mục`);
                } else if (successCount === 0) {
                  message.error(`Xóa thất bại tất cả ${failedCount} mục`);
                } else {
                  message.warning(`Xóa thành công ${successCount} mục, thất bại ${failedCount} mục`);
                }
                
                setSelectedRowKeys([]);
                fetchRootNodes(pagination.current, pagination.pageSize);
                console.log("Deleted selected records:", selectedRowKeys);
              } catch (err) {
                message.destroy();
                message.error("Có lỗi xảy ra khi xóa dữ liệu");
                console.error("Bulk delete error:", err);
              }
            },
          });
        };

        const handleEdit = (record) => {
          updateModel({ rowDataSelect: record });
          runQuery(model.showDetail);
          console.log("edit", record);
        };

        const onExpand = async (expanded, record) => {
          if (!expanded || record.isLeaf !== false || record.children?.length > 0) return;
          
          setParentId(record.id);

          const updateChildrenRecursive = (nodes, parentId, children) =>
            nodes.map((node) =>
              node.id === parentId
                ? { ...node, children }
                : node.children?.length > 0
                ? { ...node, children: updateChildrenRecursive(node.children, parentId, children) }
                : node
            );

          try {
            const url = `http://10.165.68.7:30216/characteristicCategory?offset=0&limit=10&parent.id=${record.id}&sort=_id`;
            if (!model.authorization) return;
            
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${model.authorization}`,
                "Content-Type": "application/json",
              },
            });
            
            if (!response.ok) throw new Error("API error: " + response.status);
            
            const data = await response.json();
            if (Array.isArray(data)) {
              const children = data.map((item, idx) => ({
                key: item.id || idx,
                ...item,
                isParent: !item.isLeaf,
                children: item.isLeaf === false ? [] : undefined,
              }));
              
              setDataTable((prev) => updateChildrenRecursive(prev, record.id, children));
            }
          } catch (err) {
            console.error("Expand error:", err);
          }
        };

        const onPageChange = (page, pageSize) => {
          fetchRootNodes(page, pageSize);
        };

        const paginationConfig = {
          current: pagination.current,
          pageSize: pagination.pageSize,
          total: pagination.total,
          onChange: onPageChange,
          onShowSizeChange: onPageChange,
          pageSizeOptions: ["10", "20", "50"],
          showSizeChanger: true,
          showTotal: (total, range) =>
            `${range[0]}-${range[1]} của ${total} mục`,
        };

        return (
          <div className="table-container">
            <SearchComponent
              runQuery={runQuery}
              model={model}
              updateModel={updateModel}
              onReload={() => fetchRootNodes(1, pagination.pageSize)}
              onDeleteSelected={handleDeleteSelected}
              selectedCount={selectedRowKeys.length}
              onSearch={handleSearch}
            />
            <Table
              columns={columns}
              dataSource={dataTable}
              pagination={paginationConfig}
              onExpand={onExpand}
              rowExpandable={(record) => record.isLeaf === false}
              defaultExpandAllRows={false}
              expandIcon={({ expanded, onExpand, record }) =>
                record.isLeaf === false ? (
                  <Button
                    type="text"
                    size="small"
                    icon={
                      expanded ? (
                        <icons.DownOutlined />
                      ) : (
                        <icons.RightOutlined />
                      )
                    }
                    onClick={(e) => onExpand(record, e)}
                    className="custom-expand-icon"
                  />
                ) : null
              }
              scroll={scroll}
              size="middle"
              rowKey="id"
            />
          </div>
        );
      };

      const ConnectedComponent = Lowcoder.connect(MyCustomComponent);
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<ConnectedComponent />);
    </script>
  </body>
</html>
